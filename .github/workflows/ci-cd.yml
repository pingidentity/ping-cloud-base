name: ci-cd

on:
  push:
    branches-ignore:
      - master
      - main
    tags-ignore:
      - 'v*'
  workflow_dispatch:
    inputs:
      k8sDeployToolsImage:
        description: "K8S_DEPLOY_TOOLS image & tag to use for the build jobs"
        required: false
        type: string
      clusterPostfixes:
        description: "CLUSTER_POSTFIXES to run on"
        required: false
        type: string
      branchSkipTests:
        description: "tests to skip"
        required: false
        type: string

# Wait on in-progress runs for the same branch/ref when a new push arrives so it doesn't fill up all the clusters.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

env:
  SHARED_CI_SCRIPTS_DIR: "/ci-scripts"
  CLUSTER_POSTFIXES: ${{ inputs.clusterPostfixes || '_11 _12 _14 _15' }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  AWS_SSH_KEY_ID: ${{ vars.AWS_SSH_KEY_ID }}
  NEW_RELIC_LICENSE_KEY: ${{ vars.NEW_RELIC_LICENSE_KEY }}
  # 01-test-ocsp-stapling.sh causes other failures due to NGINX restart - ticket to fix is PDO-8100
  BRANCH_SKIP_TESTS: >-
    ${{ inputs.branchSkipTests || 'pingaccess/08-artifact-test.sh
    pingdelegator/01-admin-user-login.sh
    ingress-nginx/01-test-ocsp-stapling.sh
    self-service/test_tls.py'}}

defaults:
  run:
    shell: bash

jobs:
  compile:
    name: compile
    runs-on: ping-internal-x86-dind-p1as
    container: &k8s_deploy_tools
      image: ${{ inputs.k8sDeployToolsImage || 'docker.corp.pingidentity.com:5000/platform-pipeline/k8s-deploy-tools:v2.4-release-branch' }}
    steps:
      - name: Repository Setup
        uses: ping-internal/p1as-eng-tools/.github/actions/repo-setup@master
        with:
          setup-github-app-configuration: true
          github-app-client-id: ${{ vars.GH_CLIENT_ID }}
          github-app-private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Run compile
        run: |
          ${SHARED_CI_SCRIPTS_DIR}/k8s/compile/compile.sh
          echo "COMPILE_RESULT=$?" >> compile.env

      - name: Upload compile-env
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: compile-env
          path: ${{ github.workspace }}/compile.env
          retention-days: 1

  ## Find cluster stage - runs in parallel with compile ##
  find-cluster:
    name: find-cluster
    runs-on: ping-internal-x86-dind-p1as
    container: *k8s_deploy_tools
    steps:
      - name: Repository Setup
        uses: ping-internal/p1as-eng-tools/.github/actions/repo-setup@master

      - name: Find cluster
        run: "${SHARED_CI_SCRIPTS_DIR}/k8s/deploy/find_cluster.sh"

      - name: Upload cluster-env artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cluster-env
          path: ${{ github.workspace }}/cluster.env
          if-no-files-found: warn

  ## Deploy stage ##
  deploy:
    name: deploy
    needs: [find-cluster]
    runs-on: ping-internal-x86-dind-p1as
    container: *k8s_deploy_tools
    env:
      YAML_OUT_DIR: ${{ github.workspace }}/out
    steps:
      - name: Repository Setup
        uses: ping-internal/p1as-eng-tools/.github/actions/repo-setup@master
        with:
          setup-github-app-configuration: true
          github-app-client-id: ${{ vars.GH_CLIENT_ID }}
          github-app-private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Download cluster-env artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cluster-env
          path: ${{ github.workspace }}

      - name: Deploy
        run: |
          git config --global --add safe.directory "*"
          mkdir -p "$YAML_OUT_DIR"
          set -a
          [ -f "${GITHUB_WORKSPACE}/cluster.env" ] && source "${GITHUB_WORKSPACE}/cluster.env"
          set +a
          ${SHARED_CI_SCRIPTS_DIR}/k8s/deploy/deploy-wrapper.sh

      - name: Upload out/
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: out
          path: ${{ github.workspace }}/out/
          retention-days: 1

      - name: Upload deploy-failure-logs artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: deploy-failure-logs
          path: ${{ github.workspace }}/deploy-failure-logs/
          if-no-files-found: ignore
          retention-days: 7

    ## start security stage ##
  # These only need `deploy`, so they run right after
  # deploy rather than waiting for the rest of the pipeline to reach the security stage.
  #TODO: re-enable once https://pingidentity.atlassian.net/browse/DEVHELP-45825 is resolved
