  #        run: |
  #          echo "running AWS command"
  #          aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | HOME=/tmp docker login --username AWS --password-stdin "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
  #          echo "running deploy tools script"
  #          ${SHARED_CI_SCRIPTS_DIR}/k8s/security/copy-images.sh

  kubelinter-uber-yaml:
    name: kubelinter-uber-yaml
    needs: [ deploy ]
    runs-on: ping-internal-x86-dind-p1as
    container: *k8s_deploy_tools
    env:
      UBER_YAML: ${{ github.workspace }}/out/___w_p1as-eng-base_p1as-eng-base.yaml
    steps:
      - name: Repository Setup
        uses: ping-internal/p1as-eng-tools/.github/actions/repo-setup@master

      - name: Download out/ artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: out
          path: ${{ github.workspace }}/out

      - name: Run kubelinter-uber-yaml
        run: |
          export SKIP_CONFIGURE_KUBE=true
          ${SHARED_CI_SCRIPTS_DIR}/k8s/security/security-context-lint.sh $UBER_YAML

  ## Run kube-linter against these microservices as well to validate their security
  ## context configurations as they would appear when deployed within the broader project.
  kube-linter:
    name: kube-linter (${{ matrix.microservice }})
    needs: [deploy]
    runs-on: ping-internal-x86-dind-p1as
    container: *k8s_deploy_tools
    env:
      UBER_YAML_DIR: ${{ github.workspace }}/out
    strategy:
      fail-fast: false
      matrix:
        microservice:
          - p1as-beluga-tools
          - p1as-cluster-tools
          - p1as-observability
          - p1as-pingdirectory
          - p1as-pingfederate
          - p1as-self-service
          - p1as-pingaccess
    steps:
      - name: Repository Setup
        uses: ping-internal/p1as-eng-tools/.github/actions/repo-setup@master

      - name: Download out/ artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: out
          path: ${{ github.workspace }}/out

      - name: Run check-ext-images
        run: |
          export SKIP_CONFIGURE_KUBE=true
          UBER_YAML=$(find "${UBER_YAML_DIR}/${{ matrix.microservice }}/" -type f -name "uber.yaml")
          ${SHARED_CI_SCRIPTS_DIR}/k8s/security/security-context-lint.sh $UBER_YAML

  check-ext-images:
    name: check-ext-images
    needs: [deploy]
    runs-on: ping-internal-x86-dind-p1as
    container: *k8s_deploy_tools
    env:
      UBER_YAML: ${{ github.workspace }}/out/___w_p1as-eng-base_p1as-eng-base.yaml
    steps:
      - name: Repository Setup
        uses: ping-internal/p1as-eng-tools/.github/actions/repo-setup@master

      - name: Download out/ artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: out
          path: ${{ github.workspace }}/out

      - name: Run check-ext-images
        run: ${SHARED_CI_SCRIPTS_DIR}/k8s/security/check_ext_images.sh "$UBER_YAML"

  scan:
    name: scan
    needs: [deploy]
    if: ${{ endsWith(github.ref_name, '-release-branch') }}
    continue-on-error: true
    runs-on: ping-internal-x86-dind-p1as
    container: *k8s_deploy_tools
    env:
      UBER_YAML: ${{ github.workspace }}/out/___w_p1as-eng-base_p1as-eng-base.yaml
    steps:
      - name: Download out/ artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: out
          path: ${{ github.workspace }}/out

      - name: Run kubescape scan
        run: kubescape scan --format json --format-version v2 --verbose --output report.json framework all "$UBER_YAML"

      - name: Upload report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: report
          path: report.json
          retention-days: 365
  ## end security stage ##

  # Integration Test stage ##

  # Common pre-check tests.
  pre-check:
    name: pre-check
    needs:
      - compile
      - find-cluster
      - deploy
    runs-on: ping-internal-x86-dind-p1as
    container: *k8s_deploy_tools
    steps:
      - name: Repository Setup
        uses: ping-internal/p1as-eng-tools/.github/actions/repo-setup@master

      - name: Download cluster-env artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cluster-env
          path: ${{ github.workspace }}

      - name: Run pre-check tests
        uses: ping-internal/p1as-eng-tools/.github/actions/retry@master
        with:
          retry-name: pre-check
          command: |
            set -a
            [ -f "${GITHUB_WORKSPACE}/cluster.env" ] && source "${GITHUB_WORKSPACE}/cluster.env"
            set +a
            ${SHARED_CI_SCRIPTS_DIR}/test/run-tests.sh pre-check

  ## PA-WAS stage ##
  pa-was-integration-tests:
    name: pa-was-integration-tests
    needs:
      - compile
      - find-cluster
      - deploy
      - pre-check
    runs-on: ping-internal-x86-dind-p1as
    container: *k8s_deploy_tools
    steps:
      - name: Repository Setup
        uses: ping-internal/p1as-eng-tools/.github/actions/repo-setup@master

      - name: Download cluster-env artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cluster-env
          path: ${{ github.workspace }}

      - name: Run PA-WAS integration tests
        uses: ping-internal/p1as-eng-tools/.github/actions/retry@master
        with:
          retry-name: pingaccess-was
          command: |
            set -a
            [ -f "${GITHUB_WORKSPACE}/cluster.env" ] && source "${GITHUB_WORKSPACE}/cluster.env"
            set +a
            ${SHARED_CI_SCRIPTS_DIR}/test/run-tests.sh pingaccess-was

  ################################################
  # All integration tests defined to run on the  #
  # traditionally deployed P1AS                  #
  ################################################
  integration-tests:
    name: integration-tests (${{ matrix.test }})
    needs:
      - compile
      - find-cluster
      - deploy
      - pre-check
      - pa-was-integration-tests
#    if: ${{ vars.ENV_TYPE == '' && github.event_name != 'schedule' }}
    runs-on: ping-internal-x86-dind-p1as
    container: *k8s_deploy_tools
    env:
      UBER_YAML: ${{ github.workspace }}/out/___w_p1as-eng-base_p1as-eng-base.yaml
    strategy:
      fail-fast: false
      matrix:
        test: &all-tests
          - pingdirectory
          - pingdelegator
          - pingfederate
          - pingaccess
          - pingcloud-services
          - pingcentral
          - pingdatasync
          - common
          - monitoring
          - health
          - pingone
          - ingress-nginx
          - cert-manager
          - logging
          - self-service
          - argocd
          - system-scaling
    steps:
      - name: Repository Setup
        uses: ping-internal/p1as-eng-tools/.github/actions/repo-setup@master

      - name: Download cluster-env artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cluster-env
          path: ${{ github.workspace }}

      - name: Download out/ artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: out
          path: ${{ github.workspace }}/out

      - name: Run integration tests
        uses: ping-internal/p1as-eng-tools/.github/actions/retry@master
        with:
          retry-name: ${{ matrix.test }}
          command: |
            set -a
            [ -f "${GITHUB_WORKSPACE}/cluster.env" ] && source "${GITHUB_WORKSPACE}/cluster.env"
            set +a
            export SKIP_TESTS="${BRANCH_SKIP_TESTS}"
            ${SHARED_CI_SCRIPTS_DIR}/test/run-tests.sh ${{ matrix.test }}

      - name: Upload integration test logs
        if: ${{ failure() && matrix.test == 'pingone' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: integration_test_logs-${{ matrix.test }}
          path: ${{ github.workspace }}/tests/pingone/latest_logs/

