  #    continue-on-error: true
  #    runs-on: ping-internal-x86-dind-p1as
  #    container: *k8s_deploy_tools
  #    env:
  #      BELUGA_VERSION: ${{ github.ref_name }}
  #      ARTIFACTORY_URL: docker.corp.pingidentity.com:5000
  #      ARTIFACTORY_PATH: beluga-xray
  #      ARTIFACTORY_REGISTRY_USER: ${{ vars.ARTIFACTORY_REGISTRY_USER }}
  #      ARTIFACTORY_REGISTRY_PW: ${{ secrets.ARTIFACTORY_REGISTRY_PW }}
