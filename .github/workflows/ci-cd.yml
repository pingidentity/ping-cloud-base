  ## Chaos testing stage ##
  chaos-tests:
    name: chaos-tests
    needs:
      - compile
      - find-cluster
      - deploy
      - pre-check
      - pa-was-integration-tests
      - integration-tests
#      - integration-tests-scheduled-pipeline
#      - integration-tests-chub
    runs-on: ping-internal-x86-dind-p1as
    container: *k8s_deploy_tools
    steps:
      - name: Repository Setup
        uses: ping-internal/p1as-eng-tools/.github/actions/repo-setup@master

      - name: Download cluster-env artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cluster-env
          path: ${{ github.workspace }}

      - name: Run chaos tests
        uses: ping-internal/p1as-eng-tools/.github/actions/retry@master
        with:
          retry-name: chaos
          command: |
            set -a
            [ -f "${GITHUB_WORKSPACE}/cluster.env" ] && source "${GITHUB_WORKSPACE}/cluster.env"
            set +a
            ${SHARED_CI_SCRIPTS_DIR}/test/run-tests.sh chaos

  ## Cleanup stage that runs when everything has succeeded ##
  # Also has no `needs:` override in GitLab, so (like chaos-tests) it stage-sequentially
  # waits for the entire chain, and needs the same skip-tolerant result checks.
  cleanup-on-success:
    name: cleanup-on-success
    needs:
      - compile
      - find-cluster
      - deploy
      - pre-check
      - pa-was-integration-tests
      - integration-tests
#      - integration-tests-scheduled-pipeline
#      - integration-tests-chub
      - chaos-tests
    runs-on: ping-internal-x86-dind-p1as
    container: *k8s_deploy_tools
    steps:
      - name: Repository Setup
        uses: ping-internal/p1as-eng-tools/.github/actions/repo-setup@master

      - name: Download cluster-env artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cluster-env
          path: ${{ github.workspace }}

      - name: Teardown cluster
        run: |
          set -a
          [ -f "${GITHUB_WORKSPACE}/cluster.env" ] && source "${GITHUB_WORKSPACE}/cluster.env"
          set +a
          ${SHARED_CI_SCRIPTS_DIR}/k8s/cleanup/teardown.sh

  ## Cleanup stage for failed compile stage ##
  cleanup-on-compile-failure:
    name: cleanup-on-compile-failure
    needs:
      - compile
      - find-cluster
      - deploy
    if: failure()
    runs-on: ping-internal-x86-dind-p1as
    container: *k8s_deploy_tools
    steps:
      - name: Repository Setup
        uses: ping-internal/p1as-eng-tools/.github/actions/repo-setup@master

      - name: Download cluster-env artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cluster-env
          path: ${{ github.workspace }}

      - name: Download compile-env artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: compile-env
          path: ${{ github.workspace }}

      - name: Cleanup
        run: |
          set -a
          [ -f "${GITHUB_WORKSPACE}/cluster.env" ] && source "${GITHUB_WORKSPACE}/cluster.env"
          [ -f "${GITHUB_WORKSPACE}/compile.env" ] && source "${GITHUB_WORKSPACE}/compile.env"
          set +a
          # Only cleanup when compile fails.
          # If compile passes, deployment remains for troubleshooting
          if [ "$COMPILE_RESULT" != 0 ]; then
            ${SHARED_CI_SCRIPTS_DIR}/k8s/cleanup/teardown.sh;
          else
            echo "Compile passed, deployment not torn down to allow for troubleshooting";
          fi

  ci-cd-gatekeeper:
    name: ci-cd-gatekeeper
    runs-on: ubuntu-latest
    if: always()
    needs:
      - compile
#      - copy-images
      - kubelinter-uber-yaml
      - kube-linter
      - check-ext-images
      - scan
      - find-cluster
      - deploy
      - pre-check
      - pa-was-integration-tests
      - integration-tests
#      - integration-tests-scheduled-pipeline
#      - integration-tests-chub
      - chaos-tests
      - cleanup-on-success
      - cleanup-on-compile-failure
    steps:
      - uses: ping-internal/p1as-eng-tools/.github/actions/ci-cd-gatekeeper@master
        with:
          results: ${{ join(needs.*.result, ' ') }}
