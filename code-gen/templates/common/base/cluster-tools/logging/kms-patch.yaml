# Removes the unencrypted Logstash StorageClass and points logstash-elastic +
# logstash-elastic-s3 StatefulSets to the KMS-encrypted gp3 StorageClass.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: logstash-gp3
$patch: delete
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: logstash-elastic
spec:
  volumeClaimTemplates:
  - metadata:
      name: logstash-gp3
      annotations:
        volume.autoscaler.kubernetes.io/scale-above-percent: "85"
        volume.autoscaler.kubernetes.io/scale-up-percent: "25"
      labels:
        app: logstash-elastic
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: logstash-gp3-kms
      resources:
        requests:
          storage: 50Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: logstash-elastic-s3
spec:
  volumeClaimTemplates:
  - metadata:
      name: logstash-s3-gp3
      annotations:
        volume.autoscaler.kubernetes.io/scale-above-percent: "85"
        volume.autoscaler.kubernetes.io/scale-up-percent: "25"
      labels:
        app: logstash-elastic-s3
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: logstash-gp3-kms
      resources:
        requests:
          storage: 12Gi
