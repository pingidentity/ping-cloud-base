# KMS-encrypted gp3 StorageClass for Logstash
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: logstash-gp3-kms
allowVolumeExpansion: true
provisioner: ebs.csi.aws.com
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
parameters:
  csi.storage.k8s.io/fstype: ext4
  encrypted: "true"
  type: gp3
  kmsKeyId: ${EBS_KMS_KEY_ARN}

# KMS-encrypted gp3 StorageClass for OpenSearch
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  labels:
    app: opensearch
    role: data
  name: opensearch-gp3-kms
allowVolumeExpansion: true
provisioner: ebs.csi.aws.com
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
mountOptions:
  - discard
parameters:
  csi.storage.k8s.io/fstype: ext4
  encrypted: "true"
  type: gp3
  kmsKeyId: ${EBS_KMS_KEY_ARN}