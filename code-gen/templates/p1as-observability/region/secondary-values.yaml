# Overrides applied to child/secondary CDE regions at code-gen time.
# Merged into values.yaml by generate-cluster-state.sh when REGION != PRIMARY_REGION.
#
# 1. remoteWrite: In child regions p1as-prometheus (server) is removed via
#    PRIMARY_REGION_ONLY_DEPLOY, so "prometheus-headless:9090" does not resolve.
#    Override the URL to point to the primary region's Prometheus server via
#    the cross-region DNS record created by external-dns on the headless service.
#
# 2. opensearch-grafana-credentials: The secret is created by p14c-integration
#    which only runs in the primary region. Override optional to true so
#    prometheus-agent can start without the secret in child regions.
#
# 3. extraManifests: We use extraManifests because the base Prometheus Helm chart lacks a native toggle to set the service type to ExternalName.
#    This injects a cross-region DNS alias so that the prometheus agent in child regions can send its data to the primary region,
#    and so volume-autoscaler can source metrics from the primary Prometheus. Since p1as-prometheus is not deployed in secondary regions,
#    this ExternalName Service is the only prometheus-headless service in the cluster.
prometheus-agent:
  extraManifests:
    - |
      apiVersion: v1
      kind: Service
      metadata:
        name: prometheus-headless
        namespace: prometheus
      spec:
        type: ExternalName
        externalName: prometheus-central.${PRIMARY_DNS_ZONE}

  server:
    remoteWrite:
      - url: 'http://prometheus-central.${PRIMARY_DNS_ZONE}:9090/api/v1/write'
    #Extra volumes and volume mounts are intentionally left blank to remove the opensearch-grafana-credentials secret from child regions.
    extraVolumes: []
    extraVolumeMounts: []
