#Cloudwatch related values
cloudwatch:
  enabled : ${CLOUDWATCH_ENABLED}
#The IRSA role ARN to be used for the CWAgent serviceAccount, for the customer environment
  irsaCwAgentAnnotationKeyValue: "${IRSA_CWAGENT_ANNOTATION_KEY_VALUE}"
  image:
    repository: public.ecr.aws/r2h3l6e4/pingcloud-clustertools/amazon/cloudwatch-agent
    tag: 1.300026.3b189

  resources:
    limits:
      cpu:  200m
      memory: 200Mi
    requests:
      cpu: 200m
      memory: 200Mi


#Newrelic related values
global:
  cluster: ${TENANT_NAME}_${ENV}_${REGION}_k8s-cluster

#######################################################
# Prometheus Server (p1as-prometheus) settings
#######################################################
prometheus:
  server:
    # Retention time for Prometheus. Could be set in years(y), weeks(w), days(d), hours(h), minutes(m) or seconds(s)
    retention: "15d"

    persistentVolume:
      # Storage size for prometheus data volume
      # Adjust based on retention period and scrape volume
      size: 30Gi

    statefulSet:
      headless:
        annotations:
          # Prometheus cross-region communication - DNS hostname for the headless service
          external-dns.alpha.kubernetes.io/hostname: prometheus-central.${VALUES_FILES_DNS_ZONE}

    # Environment variables injected into the Prometheus container.
    # The base chart sets external_labels with ${CLUSTER_NAME}, ${TENANT_NAME},
    # ${REGION_NICK_NAME} placeholders and enables --enable-feature=expand-external-labels,
    # so Prometheus expands them at runtime from these env vars.
    env:
      - name: CLUSTER_NAME
        value: ${CLUSTER_NAME}
      - name: TENANT_NAME
        value: ${TENANT_NAME}
      - name: REGION_NICK_NAME
        value: ${REGION_NICK_NAME}

    # Resource limits for dev/test environments (matches legacy PCB base/test size)
    # For prod environments, these are overridden by prod-values.yaml
    resources:
      limits:
        cpu: 2000m
        memory: 8Gi
      requests:
        cpu: 1000m
        memory: 4Gi

#######################################################
# Prometheus Job Exporter settings
#######################################################
prometheusJobExporter:
  image:
    tag: v3.0.0
  # Commands and schedules to obtain users count. Values should be in single quotes. 
  promUserCount1Command: "echo 0"
  promUserCount2Command: "echo 0"
  promUserCount3Command: "echo 0"
  promUserCount4Command: "echo 0"

  # Schedules should be in cron format. Command should return only numeric value(int\float)
  promUserCount1Schedule: "* * * * *"
  promUserCount2Schedule: "* * * * *"
  promUserCount3Schedule: "* * * * *"
  promUserCount4Schedule: "* * * * *"

  # Namespace where pingdirectory pods run (for user count commands)
  containerNamespace: ${PING_CLOUD_NAMESPACE}

#######################################################
# Prometheus Agent resource settings
#######################################################
prometheus-agent:
  server:
    # Environment variables for expand-external-labels (same as prometheus server above)
    env:
      - name: CLUSTER_NAME
        value: ${CLUSTER_NAME}
      - name: TENANT_NAME
        value: ${TENANT_NAME}
      - name: REGION_NICK_NAME
        value: ${REGION_NICK_NAME}

    resources:
      limits:
        cpu: 500m
        memory: 4000Mi
      requests:
        cpu: 100m
        memory: 512Mi

    # opensearch-grafana-credentials is created in p14c-integration container by the 
    # OpenSearch controller manager.  In primary CDE regions the secret will exist, 
    # for child/secondary CDE regions and customer-hub envs  OpenSearch is not deployed 
    # and the secret will not exist.  secondary-values.yaml and chub-values.yaml override 
    # this to remove the volume mount
    extraVolumes:
      - name: os-creds
        secret:
          secretName: opensearch-grafana-credentials
          optional: false
          items:
            - key: password
              path: os-password

# opensearch-newrelic-credentials is created in p14c-integration container by the 
# OpenSearch controller manager.  In primary CDE regions the secret will exist, 
# for child/secondary CDE regions and customer-hub envs  OpenSearch is not deployed 
# and the secret will not exist.  secondary-values.yaml and chub-values.yaml override 
# this to remove the volume mount
nri-bundle:
  newrelic-prometheus-agent:
    extraVolumes:
      - name: os-password
        secret:
          secretName: opensearch-newrelic-credentials
          optional: false
    extraVolumeMounts:
      - name: os-password
        mountPath: /etc/secrets
        readOnly: true