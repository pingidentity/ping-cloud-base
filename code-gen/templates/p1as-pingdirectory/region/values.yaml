pingdirectory:
  ####### Backup Variables #######
  backup:
    backupRestorePod: "pingdirectory-0"
  ####### Manage Profile Configuration Flags #######
  manageProfile:
    skipValidationEnabled: "true"
    replaceFullProfileEnabled: "true"
  monitorBucketUrl: "${PD_MONITOR_BUCKET_URL}"
  # Changes PURGE_BATCH_SIZE for -Dcom.unboundid.directory.server.plugins.PurgeExpiredDataPlugin.BATCH_SIZE= - default is 10000
  purgeBatchSize: "10000"
  maxHeapSize: "3g"
  # The IRSA role ARN to be used for the PingDirectory serviceAccount
  irsaPdAnnotationKeyValue: "${IRSA_PD_ANNOTATION_KEY_VALUE}"

  # Customization for pingdirectory ingress resource
  ingress:
    enableExternalIngress: false
  statefulSet:
    lastUpdateReason: "NA"
    replicas: "2"
    # Set container limits for the pingdirectory deployment
    pingdirectory:
      resources:
        limits:
          memory: "12Gi"
          cpu:  "3"
        requests:
          memory: "12Gi"
          cpu: "2"
    statsdExporter:
      resources:
        limits:
          cpu: "100m"
          memory: "300Mi"
        requests:
          cpu: "100m"
          memory: "100Mi"
  # Persistent volume size configuration.
  persistentVolume:
    size: 40Gi
  # PingDirectory Shared Cache Settings
  # Set this to 'true' to use shared cache for the local backends
  pdUseSharedCache: "false"
  # Set this to define overall cache size .This would to be shared across all local backends
  sharedCachePercent: "55"

pingdirectoryproxy:
  monitorBucketUrl: "${PD_MONITOR_BUCKET_URL}"
  maxHeapSize: "3g"
  statefulSet:
    lastUpdateReason: "NA"
    replicas: "3"
    # Keep at least 66% of proxy pods available; do not lower this in customer environment.
    # With 3 replicas in customer environment, this keeps 2 pods running and allows 1 eviction.
    podDisruptionBudget:
      minAvailable: "66%"
    # Container specific configuration
    pingdirectoryproxy:
      resources:
        limits:
          memory: "4Gi"
          cpu: "2"
        requests:
          memory: "4Gi"
          cpu: "2"
  healthChecks:
    replicationBacklog:
      maximumAvailableMissingChanges: 5000
      minimumDegradedMissingChanges: 1000
      maximumDegradedMissingChanges: 25000
      minimumUnavailableMissingChanges: 10000