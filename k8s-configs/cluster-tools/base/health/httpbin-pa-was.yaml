#
# This defines the httpbin-pa-was deployment.
#
apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthcheck-httpbin-pa-was
  labels:
    role: healthcheck-httpbin-pa-was
spec:
  selector:
    matchLabels:
      role: healthcheck-httpbin-pa-was
  template:
    metadata:
      name: healthcheck-httpbin-pa-was
      labels:
        role: healthcheck-httpbin-pa-was
    spec:
      containers:
      - name: healthcheck-httpbin-pa-was
        image: public.ecr.aws/r2h3l6e4/pingcloud-clustertools/kennethreitz/httpbin
        command: ["/bin/sh", "-c", "gunicorn -b 0.0.0.0:8080 httpbin:app -k gevent"]
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsUser: 65534
          runAsNonRoot: true
          runAsGroup: 65534
          privileged: false
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: tmp-dir
          mountPath: /tmp
        resources:
          limits:
            memory: "60Mi"
            cpu: "200m"
          requests:
            memory: "10Mi"
            cpu: "100m"
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
          successThreshold: 1
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
          successThreshold: 1
          timeoutSeconds: 3
        ports:
        - containerPort: 8080
      volumes:
      - name: tmp-dir
        emptyDir: {}
      securityContext:
        runAsNonRoot: true
---
#
# This service exposes the httpbin-pa-was port to the cluster.
#
apiVersion: v1
kind: Service
metadata:
  name: healthcheck-httpbin-pa-was
  labels:
    role: healthcheck-httpbin-pa-was
spec:
  externalName: healthcheck-httpbin-pa-was.health.svc.cluster.local
  ports:
  - port: 80
    targetPort: 8080
  selector:
    role: healthcheck-httpbin-pa-was
