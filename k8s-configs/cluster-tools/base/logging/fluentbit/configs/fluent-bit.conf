[SERVICE]
    Log_Level    ${FLB_LOG_LEVEL}
    # Flush interval (seconds) – how often to flush buffered data.
    Flush                     1
    Daemon                    off
    Parsers_File              parsers.conf
    # Path for filesystem storage (chunks and DBs)
    storage.path              /fluent-bit/state/flb-storage/
    storage.sync              normal
    storage.checksum          off
    # storage.backlog.mem_limit
    # → When Fluent Bit restarts, it scans the storage.path for "backlog" chunks
    #   (data that was never delivered). This limit caps how much memory it may
    #   use to bring those chunks "up" for flushing.
    storage.backlog.mem_limit 512M
    # storage.max_chunks_up
    #   → Maximum number of chunks that may stay "UP" (memory-mapped + in RAM)
    #     across the whole service at any time.
    #   → Each chunk ≈ 1–2 MiB → 256 chunks ≈ 256–512 MiB memory budget.
    #   → Default = 128. Raising it improves throughput and backlog flushing speed
    #     during output outages (fewer "down"↔"up" swaps).
    storage.max_chunks_up     512
    storage.metrics           on
    scheduler.base            5
    scheduler.cap             300
    HTTP_Server  On
    HTTP_Listen  0.0.0.0
    HTTP_Port    2020
    Health_Check On

@INCLUDE /fluent-bit/etc/pipeline-*.conf
