apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: logstash-elastic
spec:
  template:
    spec:
      containers:
        - name: logstash
          resources:
            limits:
              cpu: "5"
              memory: 12Gi
            requests:
              cpu: "5"
              memory: 12Gi
          env:
            - name: LS_JAVA_OPTS
              # Heap/direct split sized for stable GC and IO buffer headroom.
              value: '-Xms5g -Xmx5g -XX:MaxDirectMemorySize=2560m'
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: logstash-elastic-s3
spec:
  template:
    spec:
      containers:
        - name: logstash
          resources:
            # Guaranteed QoS (requests = limits).
            # Ensures dedicated CPU & Mem reservation for Logstash to avoid
            # CPU throttling &noisy-neighbor interference
            limits:
              cpu: "3"
              memory: 8Gi
            requests:
              cpu: "3"
              memory: 8Gi
          env:
            - name: LS_JAVA_OPTS
              # Heap/direct split sized for stable GC and IO buffer headroom.
              value: '-Xms3584m -Xmx3584m -XX:MaxDirectMemorySize=1536m'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-pipelines
data:
  pipelines.yml: |
    - pipeline.id: main
      path.config: "/usr/share/logstash/pipeline/main"
      # One worker keeps main pipeline latency stable at medium tier.
      pipeline.workers: 1
      # Batch 750 increases throughput with acceptable heap overhead.
      pipeline.batch.size: 750
    - pipeline.id: customer
      path.config: "/usr/share/logstash/pipeline/customer"
      # One worker avoids thread contention with main pipeline.
      pipeline.workers: 1
      # Batch 750 matches medium customer throughput target.
      pipeline.batch.size: 750
    - pipeline.id: dlq
      path.config: "/usr/share/logstash/pipeline/dlq"
      # Single worker preserves DLQ replay order.
      pipeline.workers: 1
      # Batch 250 caps DLQ replay burst size.
      pipeline.batch.size: 250
